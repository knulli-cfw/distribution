image boot.vfat {
        vfat {
                        extraargs = "-F 32 -n BATOCERA"
                        @files
                }

                # Setting the size to 1200M exposes the error (from genimage command line):
                # Total number of sectors (2457600) not a multiple of sectors per track (63)!
                #
                # Setting the size to 1201M exposes the error (from genimage command line):
                # Total number of sectors (2459648) not a multiple of sectors per track (63)!
                #
                # Note (1): It seems the error only shows up in Ubuntu 17.04, but not in 16.04
                # Note (2): The error message does not come from genimage nor mtools (likely from a library it links with)
                #
                # 1200M = 1200 x 1024 x 1024 bytes => 2457600 sectors => 512 bytes/sector => 39009.52 tracks
                #
                # So, the closest values to respect the 63 sectors/track constraints are 39009 and 39010:
                # 39009 tracks * 63 sector / track = 2457567 * 512 bytes / sector = 1258274304 bytes (16896 bytes under 1200M)
                # 39010 tracks * 63 sector / track = 2457630 * 512 bytes / sector = 1258306560 bytes (15360 bytes over 1200M)
                #
                # 81765 * 512 * 63 = 2637411840
                # 2637411840 / 1024 / 1024 = 2515 MiB
                size = 5G
}

image userdata.ext4 {
        ext4 {
                label = "SHARE"
                use-mke2fs = "true"
                extraargs = "-m 0 -O ^metadata_csum"
        }
        size = "512M"
        # include files from TARGET_DIR/userdata
        mountpoint = "/userdata"
}

image batocera.img {
        hdimage {
                align = "512"  # 512-byte alignment to match working table
                partition-table-type = "gpt"
                # GPT location - working table shows it at sector 2-3, but we need space
#                gpt-location = 2048  # 1MB offset for safety
                gpt-location = 81920 

        }

        # Bootloader in MBR area (not in partition table)
        partition bootloader {
                in-partition-table = "no"
                image = "../partitions/boot0.img"
                offset = 8K
        }

        # Boot package in fixed location (not in partition table)  
        partition boot-package {
                in-partition-table = "no"
                image = "../partitions/boot_package.fex"
                # Keep your existing offset, but make sure it doesn't conflict
                offset = 16793600
        }

        # Match the EXACT working partition layout:
        # Original: sectors 41984-107519 = 32MB for boot-resource (partition 1)
        partition boot-resource {
                offset = 21504000
                partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
                image = "boot.vfat"
#                size = 32M
        }

        # Original: sectors 107520-108031 = 256KB for env (partition 2)  
        partition env {
                partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
                image = "../partitions/env.img"
#                size = 256K
        }

        # Original: sectors 108032-108543 = 256KB for env-redund (partition 3)
        partition env-redund {
                partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
                image = "../partitions/env.img"
#                size = 256K
        }

        # Original: sectors 108544-239615 = 64MB for boot (partition 4)
        partition boot {
                partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
                image = "../partitions/boot.img"
#                size = 64M
        }

        # Additional partition for your custom data
        partition userdata {
                partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
                image = "userdata.ext4"
        }

}

